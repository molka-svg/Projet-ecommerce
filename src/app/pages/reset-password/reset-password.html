<div class="auth-page container">
  <div class="card auth-card">
    <header class="auth-header">
      <span class="auth-eyebrow">Sécurité du compte</span>
      <h1>Nouveau mot de passe</h1>
      <p>Entrez le code reçu par courriel et choisissez un nouveau mot de passe.</p>
    </header>

    <div *ngIf="success" class="alert alert-success">
      ✓ Mot de passe réinitialisé ! Redirection vers la page de connexion...
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span>⚠ {{ errorMessage }}</span>
    </div>

    <form *ngIf="!success" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="code" class="form-label">Code de confirmation / Token *</label>
        <input
          type="text"
          id="code"
          name="code"
          [(ngModel)]="code"
          required
          class="form-input"
          placeholder="Code reçu par e-mail"
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Nouveau mot de passe (min. 6 caractères) *</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          class="form-input"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="passwordConfirmation" class="form-label">Confirmez le nouveau mot de passe *</label>
        <input
          type="password"
          id="passwordConfirmation"
          name="passwordConfirmation"
          [(ngModel)]="passwordConfirmation"
          required
          class="form-input"
          autocomplete="new-password"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-full mt-md"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Enregistrer le nouveau mot de passe</span>
        <span *ngIf="loading">Mise à jour en cours...</span>
      </button>
    </form>

    <footer class="auth-footer">
      <p>
        <a routerLink="/login" class="back-link">← Retour à la connexion</a>
      </p>
    </footer>
  </div>
</div>
