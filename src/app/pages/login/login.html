<div class="auth-page container">
  <div class="card auth-card">
    <header class="auth-header">
      <span class="auth-eyebrow">Espace Client</span>
      <h1>Connexion</h1>
      <p>Accédez à votre compte, vos commandes et vos pièces sauvegardées.</p>
    </header>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span>⚠ {{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">E-mail ou Identifiant *</label>
        <input
          type="text"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          class="form-input"
          placeholder="votre.email@exemple.fr"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password" class="form-label">Mot de passe *</label>
          <a routerLink="/forgot-password" class="forgot-link">
            Mot de passe oublié ?
          </a>
        </div>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            class="form-input"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-visibility-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          >
            {{ showPassword ? '👁' : '👁‍🗨' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg w-full mt-md"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Se connecter</span>
        <span *ngIf="loading">Connexion en cours...</span>
      </button>
    </form>

    <footer class="auth-footer">
      <p>
        Pas encore de compte ?
        <a routerLink="/register" class="register-link">Créer un compte eshop</a>
      </p>
    </footer>
  </div>
</div>
