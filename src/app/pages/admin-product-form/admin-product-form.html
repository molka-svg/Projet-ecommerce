
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a class="brand" routerLink="/">eshop<span>.</span></a>
    <p class="sidebar-label">ADMINISTRATION</p>
    <a class="nav-item" routerLink="/admin">Vue d'ensemble</a>
    <a class="nav-item active" routerLink="/admin/products">Produits</a>
    <a class="nav-item" routerLink="/admin/categories">Catégories</a>
    <a class="nav-item" routerLink="/admin/orders">Commandes</a>
  </aside>

  <main class="admin-main">
    <a class="secondary-link" routerLink="/admin/products">← Retour aux produits</a>
    <p class="eyebrow">CATALOGUE</p>
    <h1>Ajouter un produit</h1>
    <p class="muted">Renseignez les informations de votre nouvel article.</p>

    <form class="admin-panel form-grid">
      <h2 class="full">Informations générales</h2>
      <label class="full">Nom du produit<input name="name" placeholder="Ex. Sac en toile" required /></label>
      <label class="full">Description<textarea name="description" rows="5" placeholder="Décrivez le produit..." required></textarea></label>
      <label>Prix (€)<input name="price" type="number" min="0" step="0.01" placeholder="29.90" required /></label>
      <label>Stock<input name="stock" type="number" min="0" step="1" placeholder="0" /></label>
      <label>Catégorie<select name="category"><option value="">Choisir une catégorie</option></select></label>
      <label>Statut<select name="status"><option value="draft">Brouillon</option><option value="published">Publié</option></select></label>
      <label class="full">Image du produit<input name="image" type="file" accept="image/png,image/jpeg,image/webp" /></label>
      <p class="full muted">Le champ image devra être relié au champ média configuré dans Strapi.</p>
      <div class="full form-actions">
        <a class="cancel-link" routerLink="/admin/products">Annuler</a>
        <button class="primary-button" type="submit">Enregistrer le produit</button>
      </div>
    </form>
  </main>
</div>
